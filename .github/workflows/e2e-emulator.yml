name: Emulator E2E

# Runs the real TeachFlow debug APK on an Android emulator against PracticeFood (android/testapp)
# and publishes screenshots + results to the "e2e-results" branch. See android/e2e/run_e2e.py.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/e2e-emulator.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-emulator
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build TeachFlow (debug) and PracticeFood
        run: gradle -p android :app:assembleDebug :testapp:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/testapp/build/outputs/apk/debug/testapp-debug.apk
            python3 android/e2e/run_e2e.py

      - name: Publish results to the e2e-results branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p e2e-out && cd e2e-out
          echo "Run ${GITHUB_RUN_ID} · commit ${GITHUB_SHA::7}" > RUN.txt
          git init -q && git checkout -q -b e2e-results
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "E2E results for run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" e2e-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e-out
